[project]
name = "pdf2study"
version = "0.1.0"
description = "Turn PDF textbooks into per-chapter Marp slides + MkDocs Q&A, uploaded to private Cloudflare R2."
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.17",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "boto3>=1.34.0",
    "tiktoken>=0.5.0",
    "requests>=2.31.0",
    "python-pptx>=0.6.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
pdf2study = "pdf2study.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pdf2study"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
